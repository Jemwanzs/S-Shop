# Runs on every push and pull request. Railway waits for this check before deploying main
# (service setting "Wait for CI"), so a failing build or test never reaches production.
name: CI

on:
  push:
  pull_request:
  # Roadmap 122: the dependency audit also runs weekly, so new advisories surface without a code change.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Roadmap 122: known-vulnerability scan of the Rust and npm dependencies. Reported on every push and weekly; it
  # does not gate deploys (an advisory in a third-party package is fixed as its own change), but a red job here
  # is acted on.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust — advisories (RustSec)
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm — advisories (production and build tools)
        working-directory: web
        run: npm audit --audit-level=high

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: sshop
          POSTGRES_DB: sshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:sshop@localhost:5432/sshop
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # ── Documentation is part of done (roadmap 146): index, links, user guide, architecture ──
      - name: Docs — check
        run: python3 scripts/docs_check.py

      # ── Web app: types, lint, production build (the server serves web/dist) ──
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web — install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Web — lint
        working-directory: web
        run: npx eslint . --max-warnings 0
      - name: Web — type-check & build
        working-directory: web
        run: npm run build

      # ── API server: unit tests and build ──
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Server — unit tests
        run: cargo test -p sshop
      - name: Server — build
        run: cargo build -p sshop

      # ── End-to-end: fresh database, bootstrap business, full API smoke suite ──
      - name: Start server
        env:
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          PORT: "8099"
          WEB_DIR: web/dist
          BOOTSTRAP_ADMIN_EMAIL: admin@sshop.test
          BOOTSTRAP_ADMIN_PIN: "1234"
          BOOTSTRAP_BUSINESS_NAME: CI Test Shop
          PLATFORM_ADMIN_EMAILS: admin@sshop.test
          # Paystack stand-in served by the smoke suite itself (scripts/smoke_test.py, SMOKE_PAYSTACK_PORT).
          PAYSTACK_SECRET_KEY: sk_test_ci_stand_in
          PAYSTACK_BASE_URL: http://127.0.0.1:8098
          # Resend stand-in (same smoke-suite server): onboarding, reset and status emails are read back by the suite.
          RESEND_API_KEY: re_test_ci_stand_in
          RESEND_BASE_URL: http://127.0.0.1:8098
          RESEND_WEBHOOK_SECRET: whsec_Y2ktd2ViaG9vay1zZWNyZXQtMTIzNDU2
          # Daraja stand-in (same smoke-suite server): M-Pesa accounts, STK Push sales and callbacks (roadmap 91).
          MPESA_SANDBOX_URL: http://127.0.0.1:8098
          MPESA_PRODUCTION_URL: http://127.0.0.1:8098
          # Exchange-rate stand-in (roadmap 127): the suite never depends on an outside service.
          FX_URL: http://127.0.0.1:8098/v6/latest/KES
          # Renewal invoices / trial ends / suspension would otherwise run part-way through the suite.
          BACKGROUND_JOBS: "off"
        run: |
          ./target/debug/sshop > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8099/healthz && break; sleep 1; done
          curl -sf localhost:8099/healthz
      - name: Smoke suite
        env:
          SMOKE_PAYSTACK_PORT: "8098"
          SMOKE_PAYSTACK_SECRET: sk_test_ci_stand_in
          SMOKE_RESEND_KEY: re_test_ci_stand_in
          SMOKE_RESEND_WEBHOOK_SECRET: whsec_Y2ktd2ViaG9vay1zZWNyZXQtMTIzNDU2
        run: python3 -u scripts/smoke_test.py http://localhost:8099 admin@sshop.test 1234
      - name: Server log
        if: always()
        run: tail -n 200 server.log || true
