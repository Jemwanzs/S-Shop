<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf5ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16110d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="S'Shop — everything you love in one place. Retail, inventory, sales & customer loyalty." />
    <meta name="apple-mobile-web-app-title" content="S'Shop" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>S'Shop</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Boot splash (the S'Shop loader in plain HTML/CSS) until the app renders into #root and replaces it. -->
    <style>
      .boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;animation:boot-in .2s ease-out .15s both}
      .boot-ring{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center}
      .boot-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:4.5px solid hsl(var(--muted,30 20% 90%));border-top-color:hsl(var(--brand-from,336 84% 52%));border-right-color:hsl(var(--brand-to,22 95% 52%));animation:boot-spin 1.1s linear infinite}
      .boot-ring img{width:44px;height:44px;object-fit:contain}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-in{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.boot{animation:none;opacity:1}.boot-ring::before{animation:none}}
    </style>
    <div id="root"><div class="boot" role="status" aria-label="Loading S'Shop"><div class="boot-ring"><img src="/src/assets/sshop-mark.png" alt="" /></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
